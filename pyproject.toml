[project]
name = "jaspah"
version = "0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "ruff",
    "basedpyright",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["powerline"]

[tool.basedpyright]
pythonVersion = "3.13"
# Venv is resolved from $VIRTUAL_ENV at runtime (bashrc activates ~/.venv/dev).
# Editor integrations may need their own pythonPath setting.
