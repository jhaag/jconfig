###| Setup & Configuration |########################################################################

## Keyboard

### Tmux Prefix (avoid clashing w/Emacs)
# Use prefix C-q to avoid clashing w/Emacs
unbind C-b
set -g prefix C-q
bind-key C-q send-prefix
bind-key C-q last-window

### Escapes
# Use [escape-time 0] to allow for faster key repetition
set -s escape-time 0

### Reload Tmux Config
# Bind r to re-source .tmux.conf
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

### Pane Management
# Prefer "|" and "-" for pane splitting
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

### Pane Navigation
# Support Emacs-style C-M- chords for switching tmux panes.
# Herdr pane navigation uses C-j followed by arrow keys, so tmux owns these direct chords.
bind -n C-M-b select-pane -L
bind -n C-M-f select-pane -R
bind -n C-M-p select-pane -U
bind -n C-M-n select-pane -D

# Still provide prefix-based pane selection as a guaranteed escape hatch.
bind b select-pane -L
bind f select-pane -R
bind p select-pane -U
bind n select-pane -D

## Window & Pane

### Naming
# Forbid automatic renaming
set-option -g allow-rename off

### Numbering
# Start at 1 & ensure we renumber windows upon deletion
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

### Layout
# Aggressively resize to allow automatic line reflow
setw -g aggressive-resize on

## Activity Monitoring
# [visual-{activity, bell, silence} off] + [monitor-activity on]
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity on

## Terminal

### Emulation
# True color support & support for rich key-/escape-sequences
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-features 'xterm-256color:RGB'
set -g extended-keys on
%if "#{>=:#{version},3.5}"
set -g extended-keys-format csi-u
%endif
set -as terminal-features "xterm*:extkeys"
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

### Mouse
# Enable scroll + copy
setw -g mouse on
#set -g terminal-overrides "xterm*:smcup@:rmcup@"

### Clipboard
# Clipboard integration
set -g set-clipboard external

### Passthrough
# Let DCS escape sequences reach the outer terminal so Claude Code desktop
# notifications and the progress bar are not swallowed by tmux.
set -g allow-passthrough on

## Statusline
set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 15
####################################################################################################

###| Style |########################################################################################

## Text Palette
# cf. ~/jaspah/.tmux.conf

### Spacing
set -g @SPC_ZERO "\u200b"
set -g @SPC_QUARTER "\u2005"
set -g @SPC_HALF "\u2009"

### Unicode
set -g @ACTIVE "#{@SPC_HALF}\u23ff#{@SPC_ZERO}"
set -g @HINDU_OM "#{@SPC_HALF}\u0950#{@SPC_ZERO}"
set -g @BULLSEYE "\u25ce"
set -g @UP_TRIANGLE "▲"

### Emojis
set -g @THREAD "🧵"

### Separators & Formatting
set -g @_BULLSEYE_SEP " #{@BULLSEYE} "
set -g @SEP "#{E:@_BULLSEYE_SEP}"
set -g @SEP_BRIGHT "#[bold,fg=#{@LIGHT2}]#{E:@SEP}#[default]"
set -g @SEP_DIM "#[dim,fg=#{@LIGHT2}]#{E:@SEP}#[default]"
set -g @HORIZONTAL "─"
set -g @VERTICAL "│"
set -g @BTEE "┴"
set -g @BLCORNER "╰"
set -g @BRCORNER "╯"

## Color Palette
# cf. ~/jaspah/.powerline-shell-theme.py

set -g @DARK0 "colour235"
set -g @DARK1 "colour237"
set -g @DARK2 "colour238"
set -g @DARK3 "colour241"

set -g @LIGHT2 "colour250"
set -g @LIGHT_GRAY "colour244"

set -g @BRIGHT_RED "colour167"
set -g @BRIGHT_GREEN "colour142"
set -g @BRIGHT_PURPLE "colour171"
set -g @BRIGHT_ORANGE "colour208"

set -g @NEUTRAL_ORANGE "colour166"

set -g @FADED_ORANGE "colour130"

# Note: Additional colors for tmux UI
set -g @BRIGHT_CYAN "colour51"
set -g @DARK_BG_ALT "colour236"
set -g @BRIGHT_MAGENTA "colour135"
set -g @VERY_BRIGHT_RED "colour196"
set -g @ALMOST_BLACK "colour232"

## Theme

### Foreground
# Bright Cyan
set -g @THM_FG_ACCENT "#[bold,fg=#{@BRIGHT_GREEN}]"
set -g @THM_FG "#[fg=#{@BRIGHT_CYAN}]"
set -g @THM_FG_BRIGHT "#[bold,fg=#{@BRIGHT_CYAN}]"
set -g @THM_FG_BRIGHT_ALT "#[bold,fg=#{@LIGHT2}]"
set -g @THM_FG_DIM "#[dim,fg=#{@BRIGHT_CYAN}]"
set -g @THM_FG_DIM_ALT "#[dim,fg=#{@LIGHT2}]"

### Background
set -g @THM_BG "#{@DARK0}"
set -g @THM_BG_ALT "#{@DARK_BG_ALT}"
set -g @THM_BG_DIM "#{@DARK2}"

### Default
set -g @THM_DEFAULT "#[none,fg=#{E:@THM_FG},bg=#{E:@THM_BG}]"

## Settings

### Message
set -g message-style "bold,fg=#{@BRIGHT_CYAN},bg=#{@NEUTRAL_ORANGE}"
set -g message-command-style "fg=blue,bg=black"

### Modes

### Panes
set -g pane-border-style "bg=#{@DARK0},fg=#{@DARK2}"
set -g pane-active-border-style "bg=#{@DARK1},fg=#{@BRIGHT_CYAN}"

### Windows
set -g window-status-bell-style "bold,fg=#{@DARK0},bg=#{@BRIGHT_RED}"
set -g window-status-current-style "fg=#{@BRIGHT_CYAN},bg=#{@DARK0}"
set -g window-status-last-style "underline,fg=#{@FADED_ORANGE},bg=#{@DARK0}"
set -g window-status-style "fg=#{@FADED_ORANGE},bg=#{@DARK0}"

### Statusline
set -g status-style "fg=#{@BRIGHT_CYAN},bg=#{@DARK0}"
####################################################################################################

###| Format |#######################################################################################

## Windows
set -g window-status-current-format "#{E:@SEP}#[fg=#{@LIGHT2}]#I:#[default]#W#[bold,fg=#{@BRIGHT_GREEN}]#F#[default]"
set -g window-status-format "#{E:@SEP_DIM}#[fg=#{@LIGHT2}]#I:#W#[bold,fg=#{@BRIGHT_GREEN}]#F#[default]"

## Statusline Parts

### Datetime
set -g @DATE "%a, %d %b %Y"
set -g @TIME "%H:%M:%S"
set -g @DATETIME "#{T:@DATE}#{E:@SEP_DIM}#{T:@TIME}"

### Tmux Session
set -g @TMUX_SESSION "#{p16:#{@THREAD} #{session_name}}#{E:@SEP_DIM}"

### Uptime
set -g @UPTIME_DAYS "#(awk '{print int($1/86400)}' /proc/uptime)"
set -g @UPTIME_DAYS_STYLE "#{?#{>=:#{E:@UPTIME_DAYS},7},#[fg=#{@BRIGHT_RED}],#[fg=#{@BRIGHT_CYAN}]}"
set -g @UPTIME "#{@UP_TRIANGLE} #{E:@UPTIME_DAYS_STYLE}#{E:@UPTIME_DAYS}☀#[default]"

### Segments
set -g @L0 "#{p20:#{E:@TMUX_SESSION}#{E:@UPTIME}}"
set -g @L1 "#{p20:#{T:@DATETIME}}"

## Statusline Format Settings
set -g status "4"
set -g status-left-length 50
set -g status-right-length 50
set -g status-left "#[align=left]│"
set -g status-right "#[align=right]│"

## Statuslines

### Background Information
set -g status-format[0] "#{status-left}#{p82: #{T:@L0} }#{@VERTICAL} #[align=absolute-centre] #{status-right}"

### Foreground Information
set -g status-format[1] "#{status-left}#{p56: #{T:@L1} }#{@VERTICAL} #[align=absolute-centre]#{W:#{E:window-status-format},#{E:window-status-current-format}} #{status-right}"

### Separator
set -g status-format[2] "#[align=left]#{@BLCORNER}#(printf '%0.s#{@HORIZONTAL}' $(seq 1 29))#{@BTEE}#(printf '%0.s#{@HORIZONTAL}' $(seq 1 #{e|-:#{window_width},32}))#[default]#[align=right]#{@BRCORNER}"

### Activity
# set -g status-format[3] "#[align=absolute-centre]#{E:@ACTIVE}"
set -g status-format[3] "#[align=absolute-centre]#{E:@HINDU_OM}"
