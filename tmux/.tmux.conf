###| Status Renderer |##############################################################################

# Render the full multiline status area from one Python entry point. The script
# dynamically sets `status` and the `status-format[]` array for the current
# session, then embeds itself in row 0 so tmux refreshes it at status-interval.
# Pin VIRTUAL_ENV to bashrc's managed base venv so project-specific pane venvs do
# not affect tmux status rendering.
set -g status-interval 5
set -g @JASPAH_STATUS_CMD "VIRTUAL_ENV=/home/jhaag/.venv/dev PATH=/home/jhaag/.venv/dev/bin:$PATH /home/jhaag/.local/bin/uv run --active python /home/jhaag/jaspah/tmux/status.py --quiet --session '#{session_id}' --window '#{window_id}'"
# Bootstrap only: status.py recomputes `status` (= info rows + separator) and
# the whole status-format[] array per session on every refresh. Row 0 embeds
# the driver so tmux re-runs the renderer each status-interval. Rows 1-2 are
# blanked solely to suppress tmux's default pane/session lines on a session's
# first paint, before status.py overwrites them; status-format[3+] default to
# empty already, so they need no blanking.
set -g status "4"
set -g status-format[0] "#(#{E:@JASPAH_STATUS_CMD})"
set -g status-format[1] ""
set -g status-format[2] ""

# Refresh immediately on structural events; status-interval handles the regular
# clock tick. The Python renderer sets every status-format[] row in one pass.
set-hook -g client-attached "run-shell -b \"#{E:@JASPAH_STATUS_CMD}\""
set-hook -g client-resized "run-shell -b \"#{E:@JASPAH_STATUS_CMD}\""
set-hook -g session-renamed "run-shell -b \"#{E:@JASPAH_STATUS_CMD}\""
set-hook -g session-window-changed "run-shell -b \"#{E:@JASPAH_STATUS_CMD}\""
set-hook -g after-new-window "run-shell -b \"#{E:@JASPAH_STATUS_CMD}\""
set-hook -g after-rename-window "run-shell -b \"#{E:@JASPAH_STATUS_CMD}\""
set-hook -g window-linked "run-shell -b \"#{E:@JASPAH_STATUS_CMD}\""
set-hook -g window-unlinked "run-shell -b \"#{E:@JASPAH_STATUS_CMD}\""
set-hook -g after-split-window "run-shell -b \"#{E:@JASPAH_STATUS_CMD}\""
set-hook -g after-kill-pane "run-shell -b \"#{E:@JASPAH_STATUS_CMD}\""
set-hook -g after-resize-pane "run-shell -b \"#{E:@JASPAH_STATUS_CMD}\""
set-hook -g after-select-layout "run-shell -b \"#{E:@JASPAH_STATUS_CMD}\""
run-shell -b "#{E:@JASPAH_STATUS_CMD}"
