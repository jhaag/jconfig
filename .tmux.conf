# Gruvbox color scheme variables (matching .powerline-shell-theme.py)
set -g @DARK0 "colour235"
set -g @DARK1 "colour237"
set -g @DARK2 "colour238"
set -g @DARK3 "colour241"

set -g @LIGHT2 "colour250"
set -g @LIGHT_GRAY "colour244"

set -g @BRIGHT_RED "colour167"
set -g @BRIGHT_GREEN "colour142"
set -g @BRIGHT_PURPLE "colour171"
set -g @BRIGHT_ORANGE "colour208"

set -g @NEUTRAL_ORANGE "colour166"

set -g @FADED_ORANGE "colour130"

# Additional colors for tmux UI
set -g @BRIGHT_CYAN "colour51"
set -g @DARK_BG_ALT "colour236"
set -g @BRIGHT_MAGENTA "colour135"
set -g @VERY_BRIGHT_RED "colour196"
set -g @ALMOST_BLACK "colour232"

# Change prefix to C-a (like screen) to avoid conflict with Emacs C-SPC (set-mark-command)
unbind C-b
set -g prefix C-q
bind-key C-q send-prefix
bind-key C-q last-window

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Ensure we renumber windows upon deletion
set -g renumber-windows on

# Allows for faster key repetition
set -s escape-time 0

# Enable automatic line reflow
setw -g aggressive-resize on

set-option -g allow-rename off

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Split panes using | and -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Ctrl-Alt + emacs keys for switching panes
bind -n C-M-b select-pane -L
bind -n C-M-f select-pane -R
bind -n C-M-p select-pane -U
bind -n C-M-n select-pane -D

# Activity monitoring
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -a terminal-features 'xterm-256color:RGB'

set -g extended-keys always
set -as terminal-features "xterm*:extkeys"

# Allow passthrough of terminal escape codes
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable mouse scroll and copy
setw -g mouse on
set -g terminal-overrides "xterm*:smcup@:rmcup@"

set -g set-clipboard on

# The modes {

# }
# The panes {

set -g pane-border-style "bg=#{@DARK0},fg=#{@DARK2}"
set -g pane-active-border-style "bg=#{@DARK_BG_ALT},fg=#{@BRIGHT_CYAN}"

# }
# The statusbar {

## Vars: Symbols
set -g @SEP " ◎ "
set -g @_SEP_BRIGHT "#[bold,fg=#{@LIGHT2}]#{@SEP}#[default]"
set -g @_SEP_DIM "#[dim,fg=#{@LIGHT2}]#{@SEP}#[default]"

## Style
set -g status-style "fg=#{@BRIGHT_PURPLE},bg=#{@DARK0}"
setw -g window-status-bell-style "bold,fg=#{@DARK0},bg=#{@BRIGHT_RED}"
setw -g window-status-current-style "fg=#{@BRIGHT_PURPLE},bg=#{@DARK0}"
setw -g window-status-last-style "underline,fg=#{@FADED_ORANGE},bg=#{@DARK0}"
setw -g window-status-style "fg=#{@FADED_ORANGE},bg=#{@DARK0}"

## Windows Format
set -g @_FOCUS "#[bold,fg=#{@BRIGHT_GREEN}]#F"
setw -g window-status-current-format "#{@TEXT_DIM}#I:#{@TEXT_BR_PURPLE}#W#{E:@_FOCUS}"
setw -g window-status-format "#{@TEXT_DIM}#I:#{@TEXT_DIM}#W"

## Segments

### (Init) Datetime
set -g @_DATE "%a, %d %b %Y"
set -g @_TIME "%H:%M:%S"
set -g @_DATETIME "#{T:@_DATE}#{E:@_SEP_DIM}#{T:@_TIME}"

## Statusline Settings
set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 1

## Statusline Formats
set -g status 2
set -g status-left-length 50
set -g status-right-length 50
display-message "#{status-format[0]}"
set -g status-format[0] "#[align=left]| Tmux: #S Uptime: #(uptime | cut -f 4-5 -d ' ' | cut -f 1 -d ',')#[default]#[align=right]|"
set -g status-format[1] "#[align=left]| #{T:@_DATETIME}#[align=right]|"


# }
# The messages {

set -g message-style "bold,fg=#{@ALMOST_BLACK},bg=#{@NEUTRAL_ORANGE}"
set -g message-command-style "fg=blue,bg=black"

# }
