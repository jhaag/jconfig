###| Preamble |#####################################################################################

## `jconfig` Integrations

### Variables
set -g @__MJCONFIG "#(echo ~/jconfig)"
set -g @__JCONFIG "#{@__MJCONFIG}"
set -g @__JCONFIG_SCRIPTS "#{@__JCONFIG}/scripts"
set -g @__MACROS_SH "#{@__JCONFIG}/scripts/tmux_macros.sh"

### Macros
set -g @__MBRACKET "#{E:@__MACROS_SH} '__jconfig_tmux_bracket'"

## Dynamic Self-Documentation for `.tmux.conf`
set -g @__ALL_NOTES ""
set -ga @__ALL_NOTES "#(#{E:@__MBRACKET} '' '\n\n' 'Tmux config for #{username} (cf. #{@__JCONFIG}/.tmux.conf)')"

### Variables
set -g @__NOTE_HDR_BEGIN "jconfig/.tmux.conf/"
set -g @__NOTE_HDR_END ":\n"
set -g @__NOTE_BEGIN "- "
set -g @__NOTE_END ".\n"
set -g @__MNOTES_BEGIN ""
set -g @__MNOTES_END "\n"

### Macros
set -g @__MNOTE_HDR "#{E:@__MBRACKET} '#{@__NOTE_HDR_BEGIN}' '#{@__NOTE_HDR_END}'"
set -g @__MNOTE "#{E:@__MBRACKET} '#{@__NOTE_BEGIN}' '#{@__NOTE_END}'"
set -g @__MNOTES "#{E:@__MBRACKET} '#{@__NOTES_BEGIN}' '#{@__NOTES_END}'"
####################################################################################################

###| Setup & Configuration |########################################################################

## Preamble
set -g @__ALL_CFG_NOTES ""

## Keyboard
set -g @__KBD_NOTES "#(#{E:@__MNOTE_HDR} 'Keyboard')"

### Tmux Prefix (avoid clashing w/Emacs)
set -ga @__KBD_NOTES "#(#{E:@__MNOTE} 'Use prefix C-b to avoid clashing w/Emacs')"
unbind C-b
set -g prefix C-q
bind-key C-q send-prefix
bind-key C-q last-window

### Escapes
set -ga @__KBD_NOTES "#(#{E:@__MNOTE} 'Use [escape-time 0] to allow for faster key repetition')"
set -s escape-time 0

### Reload Tmux Config
set -ga @__KBD_NOTES "#(#{E:@__MNOTE} 'Bind r to re-source .tmux.conf')"
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

### Pane Management
set -ga @__KBD_NOTES "#(#{E:@__MNOTE} 'Prefer \"|\" and \"-\" for pane splitting')"
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

### Pane Navigation
set -ga @__KBD_NOTES "#(#{E:@__MNOTE} 'Support Emacs-style C-M- chords for switching panes'"
bind -n C-M-b select-pane -L
bind -n C-M-f select-pane -R
bind -n C-M-p select-pane -U
bind -n C-M-n select-pane -D

## Window+Pane
set -g @__WINDOW_PANE_NOTES "#(#{E:@__MNOTE_HDR} 'Window & Pane')"

### Naming
set -ga @__WINDOW_PANE_NOTES "#(#{E:@__MNOTE} 'Naming: forbid renaming')"
set-option -g allow-rename off

### Numbering
set -ga @__WINDOW_PANE_NOTES "#(#{E:@__MNOTE} 'Numbering: start at 1 & ensure we renumber windows upon deletion')"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

### Window/Pane: Layout
set -ga @__WINDOW_PANE_NOTES "#(#{E:@__MNOTE} 'Layout: aggressively resize to allow automatic line reflow')"
setw -g aggressive-resize on  # Enable automatic line reflow

## Activity Monitoring
set -g @__ACTIVITY_NOTES "#(#{E:@__MNOTE_HDR} 'Activity')"
set -ga @__ACTIVITY_NOTES "#(#{E:@__MNOTE} '[visual-{activity, bell, silence} off] + [monitor-activity on]'"
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity on

## Terminal
set -g @__TERMINAL_NOTES "#(#{E:@__MNOTE_HDR} 'Terminal')"

### Emulation
set -ga @__TERMINAL_NOTES "#(#{E:@__MNOTE} 'Emulation: true color support & support for rich key-/escape-sequences')"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-features 'xterm-256color:RGB'
set -g extended-keys always
set -as terminal-features "xterm*:extkeys"
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

### Mouse
set -ga @__TERMINAL_NOTES "#(#{E:@__MNOTE} 'Mouse: enable scroll + copy'"
setw -g mouse on
#set -g terminal-overrides "xterm*:smcup@:rmcup@"

### Clipboard
set -ga @__TERMINAL_NOTES "#(#{E:@__MNOTE} 'Clipboard integration')"
set -g set-clipboard external

## Statusline
set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 15

## Postamble
set -ga @__ALL_CFG_NOTES "#(#{E:@__MNOTES} '#{@__KBD_NOTES}')"
set -ga @__ALL_CFG_NOTES "#(#{E:@__MNOTES} '#{@__WINDOW_PANE_NOTES}')"
set -ga @__ALL_CFG_NOTES "#(#{E:@__MNOTES} '#{@__ACTIVITY_NOTES}')"
set -ga @__ALL_CFG_NOTES "#(#{E:@__MNOTES} '#{@__TERMINAL_NOTES}')"
####################################################################################################

###| Style |########################################################################################

## Preamble
set -g @__ALL_STY_NOTES ""

## Text Palette
set -g @__TEXT_PALETTE_NOTES "#(#{E:@__MNOTE_HDR} 'Color Palette')"
set -ga @__TEXT_PALETTE_NOTES "#(#{E:@__MNOTE} 'cf. #{@__JCONFIG}/.tmux.conf')"

### Spacing
set -g @SPC_ZERO "\u200b"
set -g @SPC_QUARTER "\u2005"
set -g @SPC_HALF "\u2009"

### Unicode
set -g @ACTIVE "#{@SPC_HALF}\u23ff#{@SPC_ZERO}"
set -g @HINDU_OM "#{@SPC_HALF}\u0950#{@SPC_ZERO}"
set -g @BULLSEYE "\u25ce"
set -g @UP_TRIANGLE "▲"

### Emojis
set -g @THREAD "🧵"

### Separators & Formatting
set -g @_BULLSEYE_SEP " #{@BULLSEYE} "
set -g @SEP "#{E:@_BULLSEYE_SEP}"
set -g @SEP_BRIGHT "#[bold,fg=#{@LIGHT2}]#{E:@SEP}#[default]"
set -g @SEP_DIM "#[dim,fg=#{@LIGHT2}]#{E:@SEP}#[default]"
set -g @HORIZONTAL "─"
set -g @VERTICAL "│"
set -g @BTEE "┴"
set -g @BLCORNER "╰"
set -g @BRCORNER "╯"

## Color Palette
set -g @__COLOR_PALETTE_NOTES "#(#{E:@__MNOTE_HDR} 'Color Palette')"
set -ga @__COLOR_PALETTE_NOTES "#(#{E:@__MNOTE} 'cf. #{E:@__JCONFIG}/.powerline-shell-theme.py')"

set -g @DARK0 "colour235"
set -g @DARK1 "colour237"
set -g @DARK2 "colour238"
set -g @DARK3 "colour241"

set -g @LIGHT2 "colour250"
set -g @LIGHT_GRAY "colour244"

set -g @BRIGHT_RED "colour167"
set -g @BRIGHT_GREEN "colour142"
set -g @BRIGHT_PURPLE "colour171"
set -g @BRIGHT_ORANGE "colour208"

set -g @NEUTRAL_ORANGE "colour166"

set -g @FADED_ORANGE "colour130"

# Note: Additional colors for tmux UI
set -g @BRIGHT_CYAN "colour51"
set -g @DARK_BG_ALT "colour236"
set -g @BRIGHT_MAGENTA "colour135"
set -g @VERY_BRIGHT_RED "colour196"
set -g @ALMOST_BLACK "colour232"

## Theme
set -g @__THEME_NOTES "#(#{E:@__MNOTE_HDR} 'Theme')"

### Foreground
set -ga @__THEME_NOTES "#(#{E:@__MNOTE} 'Bright Cyan')"
set -g @THM_FG_ACCENT "#[bold,fg=#{@BRIGHT_GREEN}]"
set -g @THM_FG "#[fg=#{@BRIGHT_CYAN}]"
set -g @THM_FG_BRIGHT "#[bold,fg=#{@BRIGHT_CYAN}]"
set -g @THM_FG_BRIGHT_ALT "#[bold,fg=#{@LIGHT2}]"
set -g @THM_FG_DIM "#[dim,fg=#{@BRIGHT_CYAN}]"
set -g @THM_FG_DIM_ALT "#[dim,fg=#{@LIGHT2}]"

### Background
set -g @THM_BG "#{@DARK0}"
set -g @THM_BG_ALT "#{@DARK_BG_ALT}"
set -g @THM_BG_DIM "#{@DARK2}"

### Default
set -g @THM_DEFAULT "#[none,fg=#{E:@THM_FG},bg=#{E:@THM_BG}]"

## Settings
set -g @__STYLE_NOTES "#(#{E:@__MNOTE_HDR} 'Style')"

### Message
set -g message-style "bold,fg=#{@BRIGHT_CYAN},bg=#{@NEUTRAL_ORANGE}"
set -g message-command-style "fg=blue,bg=black"

### Modes

### Panes
set -g pane-border-style "bg=#{@DARK0},fg=#{@DARK2}"
set -g pane-active-border-style "bg=#{@DARK1},fg=#{@BRIGHT_CYAN}"

### Windows
set -g window-status-bell-style "bold,fg=#{@DARK0},bg=#{@BRIGHT_RED}"
set -g window-status-current-style "fg=#{@BRIGHT_CYAN},bg=#{@DARK0}"
set -g window-status-last-style "underline,fg=#{@FADED_ORANGE},bg=#{@DARK0}"
set -g window-status-style "fg=#{@FADED_ORANGE},bg=#{@DARK0}"

### Statusline
set -g status-style "fg=#{@BRIGHT_CYAN},bg=#{@DARK0}"

## Postamble
set -ga @__ALL_STY_NOTES "#(#{E:@__MNOTES} '#{@__TEXT_PALETTE_NOTES}')"
set -ga @__ALL_STY_NOTES "#(#{E:@__MNOTES} '#{@__COLOR_PALETTE_NOTES}')"
set -ga @__ALL_STY_NOTES "#(#{E:@__MNOTES} '#{@__THEME_NOTES}')"
set -ga @__ALL_STY_NOTES "#(#{E:@__MNOTES} '#{@__STYLE_NOTES}')"
####################################################################################################

###| Format |#######################################################################################

## Preamble
set -g @__ALL_FMT_NOTES ""

## Windows
set -g window-status-current-format "#{E:@SEP}#[fg=#{@LIGHT2}]#I:#[default]#W#[bold,fg=#{@BRIGHT_GREEN}]#F#[default]"
set -g window-status-format "#{E:@SEP_DIM}#[fg=#{@LIGHT2}]#I:#W#[bold,fg=#{@BRIGHT_GREEN}]#F#[default]"

## Statusline Parts

### Datetime
set -g @DATE "%a, %d %b %Y"
set -g @TIME "%H:%M:%S"
set -g @DATETIME "#{T:@DATE}#{E:@SEP_DIM}#{T:@TIME}"

### Tmux Session
set -g @TMUX_SESSION "#{p16:#{@THREAD} #{session_name}}#{E:@SEP_DIM}"

### Uptime
set -g @UPTIME_DAYS "#(awk '{print int($1/86400)}' /proc/uptime)"
set -g @UPTIME_DAYS_STYLE "#{?#{>=:#{E:@UPTIME_DAYS},7},#[fg=#{@BRIGHT_RED}],#[fg=#{@BRIGHT_CYAN}]}"
set -g @UPTIME "#{@UP_TRIANGLE} #{E:@UPTIME_DAYS_STYLE}#{E:@UPTIME_DAYS}☀#[default]"

### Segments
set -g @L0 "#{p20:#{E:@TMUX_SESSION}#{E:@UPTIME}}"
set -g @L1 "#{p20:#{T:@DATETIME}}"

## Statusline Format Settings
set -g status "4"
set -g status-left-length 50
set -g status-right-length 50
set -g status-left "#[align=left]│"
set -g status-right "#[align=right]│"

## Statuslines

### Background Information
set -g status-format[0] "#{status-left}#{p82: #{T:@L0} }#{@VERTICAL} #[align=absolute-centre] #{status-right}"

### Foreground Information
set -g status-format[1] "#{status-left}#{p56: #{T:@L1} }#{@VERTICAL} #[align=absolute-centre]#{W:#{E:window-status-format},#{E:window-status-current-format}} #{status-right}"

### Separator
set -g status-format[2] "#[align=left]#{@BLCORNER}#(printf '%0.s#{@HORIZONTAL}' $(seq 1 29))#{@BTEE}#(printf '%0.s#{@HORIZONTAL}' $(seq 1 #{e|-:#{window_width},32}))#[default]#[align=right]#{@BRCORNER}"

### Activity
# set -g status-format[3] "#[align=absolute-centre]#{E:@ACTIVE}"
set -g status-format[3] "#[align=absolute-centre]#{E:@HINDU_OM}"

