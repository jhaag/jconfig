set -ga @__ALL_NOTES "#(#{E:@__MNOTES} '#{@__ALL_CFG_NOTES}')"
set -ga @__ALL_NOTES "#(#{E:@__MNOTES} '#{@__ALL_STY_NOTES}')"
set -ga @__ALL_NOTES "#(#{E:@__MNOTES} '#{@__ALL_FMT_NOTES}')"
